- name: Work out which Git tools this machine can install
  ansible.builtin.set_fact:
    git_tools_installable: >-
      {{
        git_tools_supported[ansible_distribution]
        | default(git_tools_supported[ansible_os_family])
        | default([])
      }}

- name: Work out which Git tools to install
  ansible.builtin.set_fact:
    git_tools_to_install: "{{ selected_git_tools | intersect(git_tools_installable) }}"

- name: Report Git tools that this machine cannot install
  ansible.builtin.debug:
    msg: >-
      Skipped, no install available on {{ ansible_distribution }}:
      {{ selected_git_tools | difference(git_tools_installable) | join(', ') }}
  when: selected_git_tools | difference(git_tools_installable) | length > 0

- name: Install Git tools on Ubuntu or Debian
  ansible.builtin.import_tasks: debian.yml
  when: ansible_os_family == 'Debian'

- name: Install Git tools on macOS
  ansible.builtin.import_tasks: macos.yml
  when: ansible_os_family == 'Darwin'
