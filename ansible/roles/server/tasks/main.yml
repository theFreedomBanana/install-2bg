- name: Work out which servers this machine can install
  ansible.builtin.set_fact:
    servers_installable: >-
      {{
        servers_supported[ansible_distribution]
        | default(servers_supported[ansible_os_family])
        | default([])
      }}

- name: Work out which servers to install
  ansible.builtin.set_fact:
    servers_to_install: "{{ selected_servers | intersect(servers_installable) }}"

- name: Report servers that this machine cannot install
  ansible.builtin.debug:
    msg: >-
      Skipped, no install available on {{ ansible_distribution }}:
      {{ selected_servers | difference(servers_installable) | join(', ') }}
  when: selected_servers | difference(servers_installable) | length > 0

- name: Install servers on Ubuntu or Debian
  ansible.builtin.import_tasks: debian.yml
  when: ansible_os_family == 'Debian'

- name: Install servers on macOS
  ansible.builtin.import_tasks: macos.yml
  when: ansible_os_family == 'Darwin'
