- name: Install DBeaver
  # DBeaver publishes no apt repository, only packages on its releases page.
  when: "'dbeaver' in database_managers_to_install"
  block:
    - name: Look up the latest DBeaver release
      ansible.builtin.uri:
        url: https://api.github.com/repos/dbeaver/dbeaver/releases/latest
        return_content: true
      register: dbeaver_release

    - name: Find the DBeaver package for this architecture
      ansible.builtin.set_fact:
        dbeaver_package_url: >-
          {{
            dbeaver_release.json.assets
            | map(attribute='browser_download_url')
            | select('search', 'linux-' ~ dbeaver_arch ~ '\.deb$')
            | first | default('')
          }}
      vars:
        dbeaver_arch: "{{ 'aarch64' if ansible_architecture == 'aarch64' else 'x86_64' }}"

    - name: Require a matching DBeaver package
      ansible.builtin.assert:
        that:
          - dbeaver_package_url | length > 0
        fail_msg: >-
          No DBeaver package is published for {{ ansible_architecture }}.

    - name: Download the DBeaver package
      ansible.builtin.get_url:
        url: "{{ dbeaver_package_url }}"
        dest: /tmp/dbeaver.deb
        mode: '0644'

    - name: Run the DBeaver installer
      become: true
      ansible.builtin.apt:
        deb: /tmp/dbeaver.deb
        state: present

