- name: Install pgAdmin
  when: "'pgadmin' in database_managers_to_install"
  block:
    - name: Install prerequisites for the pgAdmin repository
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gpg
        state: present

    - name: Create APT keyrings directory
      become: true
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download the pgAdmin repository signing key
      become: true
      ansible.builtin.get_url:
        url: https://www.pgadmin.org/static/packages_pgadmin_org.pub
        dest: /etc/apt/keyrings/pgadmin.asc
        mode: '0644'

    - name: Configure the pgAdmin repository
      become: true
      ansible.builtin.deb822_repository:
        name: pgadmin4
        types: [deb]
        uris: >-
          https://ftp.postgresql.org/pub/pgadmin/pgadmin4/apt/{{
          ansible_distribution_release }}
        suites: [pgadmin4]
        components: [main]
        architectures: [amd64]
        signed_by: /etc/apt/keyrings/pgadmin.asc
        state: present
        enabled: true

    - name: Refresh the apt cache for the pgAdmin repository
      become: true
      ansible.builtin.apt:
        update_cache: true

    - name: Run the pgAdmin installer
      become: true
      ansible.builtin.apt:
        name: pgadmin4-desktop
        state: present

- name: Install DbVisualizer
  # DbVisualizer publishes a version pinned URL with no latest redirect.
  when: "'dbvis' in database_managers_to_install"
  block:
    - name: Download the DbVisualizer package
      ansible.builtin.get_url:
        url: >-
          https://www.dbvis.com/product_download/dbvis-{{ dbvisualizer_version
          }}/media/dbvis_linux_{{ dbvisualizer_version | replace('.', '_')
          }}_amd64.deb
        dest: /tmp/dbvisualizer.deb
        mode: '0644'

    - name: Run the DbVisualizer installer
      become: true
      ansible.builtin.apt:
        deb: /tmp/dbvisualizer.deb
        state: present

- name: Install MongoDB Compass
  # MongoDB Compass publishes a version pinned URL with no latest redirect.
  when: "'compass' in database_managers_to_install"
