- name: Work out which social apps this machine can install
  ansible.builtin.set_fact:
    socials_installable: >-
      {{
        socials_supported[ansible_distribution]
        | default(socials_supported[ansible_os_family])
        | default([])
      }}

- name: Drop social apps that publish no package for this architecture
  ansible.builtin.set_fact:
    socials_installable: "{{ socials_installable | difference(socials_amd64_only) }}"
  when:
    - ansible_os_family == 'Debian'
    - ansible_architecture != 'x86_64'

- name: Work out which social apps to install
  ansible.builtin.set_fact:
    socials_to_install: "{{ selected_socials | intersect(socials_installable) }}"

- name: Report social apps that this machine cannot install
  ansible.builtin.debug:
    msg: >-
      Skipped, no install available on {{ ansible_distribution }}:
      {{ selected_socials | difference(socials_installable) | join(', ') }}
  when: selected_socials | difference(socials_installable) | length > 0

- name: Install social apps on Ubuntu or Debian
  ansible.builtin.import_tasks: debian.yml
  when: ansible_os_family == 'Debian'

- name: Install social apps on macOS
  ansible.builtin.import_tasks: macos.yml
  when: ansible_os_family == 'Darwin'
